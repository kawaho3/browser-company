name: M0 research integrity

on:
  pull_request:
    paths:
      - 'REPOSITORIES_TO_STUDY.txt'
      - 'scripts/validate_references.py'
      - 'tests/test_validate_references.py'
      - 'docs/**'
      - 'AGENTS.md'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - '.github/workflows/m0-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m0-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository (actions/checkout v4.2.2 pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate study index and document structure
        run: python3 scripts/validate_references.py
      - name: Run focused offline unit tests
        run: python3 -m unittest discover -s tests -v
